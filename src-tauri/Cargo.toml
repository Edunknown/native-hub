[package]
name = "native-hub"
version = "0.3.0"
description = "NATIVE HUB: launcher de recompilaciones y ports nativos"
authors = ["Eduardo"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "native_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
native-hub-core = { path = "../crates/core" }
rusqlite = "0.43.0"
keyring = { version = "3.6.3", features = ["windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
