[package]
name = "native-hub-core"
version = "0.1.0"
description = "Núcleo de NATIVE HUB: catálogo, base de datos y lógica de dominio (sin dependencia de Tauri)"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
regex = "1.13.2"
ureq = "3.5.2"
urlencoding = "2.1.3"
sha2 = "0.11.2"
zip = "9.8.2"
sha1 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"
