[package]
name = "native-hub-core"
version = "0.1.0"
description = "Núcleo de NATIVE HUB: catálogo, base de datos y lógica de dominio (sin dependencia de Tauri)"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
